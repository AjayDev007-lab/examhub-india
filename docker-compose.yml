version: '3.8'

services:
  # MySQL 8 Database
  db:
    image: mysql:8.0
    container_name: examhub_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the deployment environment}
      MYSQL_DATABASE: examhub_india
      MYSQL_USER: examhub_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the deployment environment}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache & Background Tasks
  redis:
    image: redis:7-alpine
    container_name: examhub_redis
    restart: always

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examhub_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_NAME: "EXAMHUB INDIA"
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a mysql+aiomysql connection string}
      STORAGE_DIR: /app/storage
      SECRET_KEY: ${SECRET_KEY:?Set a unique random SECRET_KEY of at least 32 characters}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?Set SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?Set a unique strong SUPERADMIN_PASSWORD}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set FRONTEND_ORIGINS as a JSON HTTPS origin list}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the HTTPS website URL}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    volumes:
      - ./storage:/app/storage

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examhub_frontend
    restart: always
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      SECRET_KEY: ${SECRET_KEY:?Set a unique random SECRET_KEY of at least 32 characters}
      SITE_HOSTNAME: ${SITE_HOSTNAME:?Set SITE_HOSTNAME to the public website hostname}
    ports:
      - "3000:3000"

volumes:
  mysql_data:
